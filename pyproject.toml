[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fakeforge-br"
version = "0.2.1"
description = "SDK oficial do FakeForge para gerar dados brasileiros válidos (CPF, CNPJ, CEP, PIX, cartão de crédito) em testes de software. Presets verticais fintech + ecom. Zero dependências runtime."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Everton Paula", email = "hey@fakeforge.com.br" }
]
keywords = [
    "cpf", "cnpj", "cep", "pix", "gerador", "brazilian", "brazil",
    "faker", "testing", "mock", "fixture", "seed", "fake-data",
    "test-data", "python", "brasil"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://fakeforge.com.br"
Documentation = "https://fakeforge.com.br/docs"
Repository = "https://github.com/everpaula/fakeforge-python"
Issues = "https://github.com/everpaula/fakeforge-python/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "mypy>=1.0",
    "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fakeforge"]

[tool.hatch.build.targets.sdist]
include = [
    "src/fakeforge",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.mypy]
python_version = "3.8"
strict = true
